services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.production
    command: uvicorn src.api.v2.server:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
    expose:
      - "8000"
    volumes:
      - ../data:/app/data

  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.production
    command: streamlit run app/main.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env.example
    expose:
      - "8501"
    volumes:
      - ../data:/app/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui
