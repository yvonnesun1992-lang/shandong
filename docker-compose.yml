services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn src.api.v2.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      SHANDONG_AUTH_MODE: local
      SHANDONG_DATABASE_URL: sqlite:///data/shandong_v2.db
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run app/main.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      SHANDONG_AUTH_MODE: local
      SHANDONG_DATABASE_URL: sqlite:///data/shandong_v2.db
    volumes:
      - ./data:/app/data
