services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: python -m uvicorn src.api.v2.server:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: streamlit run app/main.py --server.port 8501 --server.address 0.0.0.0
    expose:
      - "8501"
    volumes:
      - ./data:/app/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui
